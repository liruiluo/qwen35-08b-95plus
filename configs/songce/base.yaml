# 交付配方共享字段——各配置与基线的唯一变量 = arm / rho / lr（见各配置文件）。
# 路径为训练服务器布局，本机复现时按环境修改。
data: snips/data-jbdef4/train.jsonl
base: /root/models/Qwen3.5-0.8B
interp_base: /root/models/Qwen3.5-0.8B-RandomInit
interp_steps: 100
rollout_url: http://127.0.0.1:30001
reward: snips
steps: 2000
group: 16
prompts_per_step: 4
lr: 3.0e-6
max_new_tokens: 160
seed: 17
save_every: 200
rho: 1.0e-3
run: true

hydra:
  job:
    chdir: false
